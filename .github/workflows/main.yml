name: Build Kernel 6.1 with System Clang

on:
  push:
  pull_request:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential bc bison flex libssl-dev \
          libelf-dev python3 python3-pip clang lld \
          gcc-aarch64-linux-gnu

    - name: Set up Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV

    - name: Build Kernel with gki_defconfig
      working-directory: kernel
      run: |
        make O=out ARCH=$ARCH SUBARCH=$SUBARCH gki_defconfig
        make -j$(nproc) O=out \
          ARCH=$ARCH SUBARCH=$SUBARCH \
          CC=$CC LD=$LD \
          CROSS_COMPILE=$CROSS_COMPILE \
          LLVM=1 LLVM_IAS=1

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      
      with:
        name: kernel-image
        path: |
          kernel/out/arch/arm64/boot/Image*
